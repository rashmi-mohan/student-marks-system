{% extends 'base.html' %}{% block content %}<div class="top"><div><div class="title">Subject Configuration 📚</div><div class="sub">Create subjects for each semester and section</div></div></div><div class="card"><form method="post"><div class="formgrid"><div class="field"><label>Subject Code</label><input name="subject_code" placeholder="Optional"></div><div class="field"><label>Subject Name</label><input name="subject_name" required></div><div class="field"><label>Semester</label><select name="semester">{% for n in range(1,9) %}<option>{{n}}</option>{% endfor %}</select></div><div class="field"><label>Section</label><select name="section">{% for s in ['A','B','C','D','E','F'] %}<option>{{s}}</option>{% endfor %}</select></div></div><br><button class="btn">+ Add Subject</button></form></div><div class="tablewrap"><table class="table"><tr><th>Code</th><th>Subject</th><th>Semester</th><th>Section</th></tr>{% for s in subjects %}<tr><td>{{s.subject_code or '—'}}</td><td><b>{{s.subject_name}}</b></td><td>Sem {{s.semester}}</td><td>{{s.section}}</td></tr>{% endfor %}</table></div>{% endblock %}
