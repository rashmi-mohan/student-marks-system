{% extends 'base.html' %}{% block content %}<div class="top"><div><div class="title">Marks Entry ✏️</div><div class="sub">Select semester and section to load only relevant students</div></div></div><div class="card"><form method="get"><div class="formgrid"><div class="field"><label>Semester</label><select name="semester" required><option value="">Select</option>{% for n in range(1,9) %}<option value="{{n}}" {% if semester==n|string %}selected{% endif %}>{{n}}</option>{% endfor %}</select></div><div class="field"><label>Section</label><select name="section" required><option value="">Select</option>{% for s in ['A','B','C','D','E','F'] %}<option value="{{s}}" {% if section==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select></div></div><br><button class="btn">Load Students & Subjects</button></form></div>{% if semester and section %}<div class="card" style="margin-top:18px"><form method="post"><div class="formgrid"><div class="field"><label>Student</label><select name="student_id" required>{% for s in students %}<option value="{{s.id}}">{{s.usn}} — {{s.name}}</option>{% endfor %}</select></div><div class="field"><label>Subject</label><select name="subject_id" required>{% for s in subjects %}<option value="{{s.id}}">{{s.subject_code or ''}} {{s.subject_name}}</option>{% endfor %}</select></div><div class="field"><label>Test Name <span class="sub">(optional)</span></label><input name="test_name"></div><div class="field"><label>Test Date</label><input type="date" name="test_date" required></div><div class="field"><label>Max Marks <span class="sub">(optional)</span></label><input type="number" step="0.01" name="max_marks"></div><div class="field"><label>Marks Obtained</label><input type="number" step="0.01" name="marks_obtained" required></div></div><br><button class="btn green">✓ Save Marks</button></form></div>{% endif %}{% endblock %}
