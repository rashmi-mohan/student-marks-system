<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Student Marks' }}</title>
<style>
*{box-sizing:border-box}
:root{--primary:#5b3ee8;--primary2:#7c4dff;--ink:#17233b;--muted:#64748b;--bg:#f5f7fb;--line:#e3e8f1}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.page{min-height:100vh;display:flex}
.sidebar{width:230px;flex:0 0 230px;min-height:100vh;background:linear-gradient(180deg,#3827a8 0%,#6541ee 55%,#7548f5 100%);color:#fff;padding:22px 14px;position:sticky;top:0}
.brand{display:flex;align-items:center;gap:8px;font-size:21px;font-weight:800;margin:0 8px 26px;color:#fff}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:11px;color:rgba(255,255,255,.94);text-decoration:none;padding:12px 13px;border-radius:10px;font-weight:600;transition:.2s}
.nav a:hover,.nav a.active{background:rgba(255,255,255,.17);color:#fff;transform:translateX(2px)}
.main{flex:1;min-width:0;padding:32px 34px}
.content{max-width:1250px;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}
.page-head h1{margin:0 0 7px;font-size:32px;line-height:1.15}
.page-head p{margin:0;color:var(--muted);font-size:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 8px 28px rgba(24,39,75,.07);margin-bottom:20px}
.card h2{margin:0 0 20px;font-size:21px}
.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.field{display:flex;flex-direction:column;gap:8px}
label{font-size:14px;font-weight:700;color:#26344d}
label span,small{font-weight:500;color:#7a8799}
input,select,textarea{width:100%;height:46px;padding:0 13px;border:1px solid #ccd5e2;border-radius:10px;background:#fff;color:var(--ink);font-size:14px;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--primary2);box-shadow:0 0 0 3px rgba(124,77,255,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:10px;padding:11px 18px;font-weight:700;text-decoration:none;cursor:pointer;font-size:14px;transition:.2s}
.btn.primary{background:linear-gradient(90deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 5px 12px rgba(91,62,232,.2)}
.btn.secondary{background:#f0edff;color:#5437d7}
.btn:hover{transform:translateY(-1px)}
.form-actions{display:flex;gap:10px;align-items:center;margin-top:23px}
.class-banner{display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(90deg,#f1efff,#fbfaff)}
.class-banner strong{font-size:20px}
.class-banner span{display:block;color:#23834d;font-size:13px;margin-top:5px;font-weight:600}
.alert{padding:13px 16px;border-radius:11px;margin-bottom:18px}
.alert.success{background:#e9f8ef;color:#18733e;border:1px solid #c9ecd6}
.alert.error{background:#fff0f0;color:#a32323;border:1px solid #f2cccc}
.muted{color:var(--muted)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden}
th,td{padding:12px 13px;border-bottom:1px solid #e8edf4;text-align:left;white-space:nowrap}
th{background:#f7f8fc;color:#34425a;font-size:13px}
tr:hover td{background:#fafbff}
@media(max-width:850px){.sidebar{width:200px;flex-basis:200px}.main{padding:24px 18px}.two-col{grid-template-columns:1fr}}
@media(max-width:620px){.page{display:block}.sidebar{width:100%;min-height:auto;position:static;padding:12px}.brand{margin:0 7px 10px}.nav{flex-direction:row;overflow-x:auto;gap:5px}.nav a{white-space:nowrap;padding:10px}.main{padding:16px}.page-head{display:block}.card{padding:19px}.class-banner{display:block}.class-banner .btn{margin-top:13px;width:100%}}
</style></head><body><div class="app"><aside class="side"><div class="brand">🎓 Student Marks</div><nav class="nav"><a href="/">🏠 Dashboard</a><a href="/students">👨‍🎓 Students</a><a href="/bulk-upload">📤 Bulk Upload</a><a href="/subjects">📚 Subjects</a><a href="/marks">✏️ Marks Entry</a><a href="/report">📊 Date Report</a></nav></aside><main class="main">{% block content %}{% endblock %}</main></div></body></html>
