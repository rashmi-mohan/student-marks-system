<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Student Marks{% endblock %}</title>
<style>
*{box-sizing:border-box}
:root{--purple:#5b3ee8;--purple2:#7c4dff;--ink:#14213d;--muted:#64748b;--bg:#f4f7fb;--line:#e3e8f1}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.app{min-height:100vh;display:flex}
.sidebar{width:235px;flex:0 0 235px;background:linear-gradient(180deg,#3726a8,#6340e8 55%,#7448f4);color:#fff;min-height:100vh;padding:20px 13px;position:sticky;top:0}
.brand{display:flex;align-items:center;gap:9px;padding:4px 10px 22px;font-size:21px;font-weight:800;color:#fff}
.brand-icon{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.nav{display:flex;flex-direction:column;gap:5px}
.nav a{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none;padding:12px 13px;border-radius:10px;font-size:14px;font-weight:650;transition:.18s}
.nav a:hover,.nav a.active{background:rgba(255,255,255,.19);transform:translateX(2px)}
.main{flex:1;min-width:0;padding:30px 34px}
.content{max-width:1280px;margin:auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}
.page-head h1{font-size:31px;margin:0 0 7px;line-height:1.15}
.page-head p{margin:0;color:var(--muted);font-size:15px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 7px 24px rgba(25,39,70,.06);margin-bottom:20px}
.card h2{margin:0 0 17px;font-size:21px}
.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.field{display:flex;flex-direction:column;gap:7px}
label{font-size:14px;font-weight:700;color:#26344d}
label span{font-weight:500;color:#7b8799}
input,select,textarea{width:100%;height:46px;padding:0 13px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--ink);font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--purple2);box-shadow:0 0 0 3px rgba(124,77,255,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:10px;padding:11px 18px;font-weight:700;text-decoration:none;cursor:pointer;font-size:14px}
.btn.primary{background:linear-gradient(90deg,var(--purple),var(--purple2));color:#fff;box-shadow:0 5px 13px rgba(91,62,232,.2)}
.btn.secondary{background:#f0edff;color:#5136d3}
.btn:hover{transform:translateY(-1px)}
.form-actions{display:flex;gap:10px;align-items:center;margin-top:22px}
.class-banner{display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(90deg,#f0edff,#fbfaff)}
.class-banner strong{font-size:20px}
.class-banner span{display:block;color:#1f7a45;font-size:13px;margin-top:5px;font-weight:650}
.alert{padding:13px 16px;border-radius:11px;margin-bottom:18px}
.alert.success{background:#e9f8ef;color:#18733e;border:1px solid #c9ecd6}
.alert.error{background:#fff0f0;color:#a32323;border:1px solid #f0caca}
.muted{color:var(--muted)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden}
th,td{padding:12px;border-bottom:1px solid #e8edf4;text-align:left;white-space:nowrap}
th{background:#f7f8fc;color:#34425a;font-size:13px}
tr:hover td{background:#fafbff}
@media(max-width:800px){.sidebar{width:200px;flex-basis:200px}.main{padding:24px 18px}.two-col{grid-template-columns:1fr}}
@media(max-width:620px){.app{display:block}.sidebar{width:100%;min-height:auto;position:static;padding:12px}.brand{padding:2px 8px 10px}.nav{flex-direction:row;overflow-x:auto}.nav a{white-space:nowrap}.main{padding:16px}.page-head{display:block}.card{padding:19px}.class-banner{display:block}.class-banner .btn{margin-top:12px;width:100%}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-icon">🎓</div>Student Marks</div>
  <nav class="nav">
    <a href="/" {% if request.path=='/' %}class="active"{% endif %}>🏠 Dashboard</a>
    <a href="/students" {% if request.path.startswith('/students') %}class="active"{% endif %}>👨‍🎓 Students</a>
    <a href="/bulk-upload" {% if request.path.startswith('/bulk-upload') %}class="active"{% endif %}>📥 Bulk Upload</a>
    <a href="/subjects" {% if request.path.startswith('/subjects') %}class="active"{% endif %}>📚 Subjects</a>
    <a href="/marks" {% if request.path.startswith('/marks') %}class="active"{% endif %}>✏️ Marks Entry</a>
    <a href="/report" {% if request.path.startswith('/report') %}class="active"{% endif %}>📊 Date Report</a>
  </nav>
</aside>
<main class="main"><div class="content">{% block content %}{% endblock %}</div></main>
</div>
</body>
</html>
