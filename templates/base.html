<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Student Marks' }}</title>
<style>
:root{--p:#5b4bdb;--p2:#8b5cf6;--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--ok:#16a34a;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}.app{display:flex;min-height:100vh}.side{width:245px;background:linear-gradient(180deg,#4036a5,#6d4aff);color:white;padding:25px 16px;position:fixed;height:100vh}.brand{font-size:21px;font-weight:800;margin:0 10px 28px}.nav a{display:block;color:#eee;text-decoration:none;padding:12px 14px;border-radius:12px;margin:6px 0}.nav a:hover{background:#ffffff20}.main{margin-left:245px;width:calc(100% - 245px);padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.title{font-size:28px;font-weight:800}.sub{color:var(--muted);margin-top:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 8px 25px #00000008}.metric{font-size:30px;font-weight:800;margin-top:7px}.icon{font-size:27px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-block;border:0;background:linear-gradient(90deg,var(--p),var(--p2));color:white;padding:11px 17px;border-radius:11px;text-decoration:none;cursor:pointer;font-weight:700}.btn.alt{background:#eef2ff;color:#4338ca}.btn.green{background:#16a34a}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d9dce5;border-radius:10px;background:white}.tablewrap{overflow:auto;margin-top:18px}.table{width:100%;border-collapse:collapse;background:white;border-radius:14px;overflow:hidden}.table th{background:#eef2ff;color:#3730a3;text-align:left}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);white-space:nowrap}.table tr:hover td{background:#fafaff}.notice{padding:13px 16px;border-radius:12px;margin:15px 0;background:#ecfdf5;color:#166534}.error{background:#fef2f2;color:#991b1b}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#f3e8ff;color:#6b21a8;font-size:12px;font-weight:700}.empty{padding:30px;text-align:center;color:var(--muted)}@media(max-width:800px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin-left:0;width:100%;padding:18px}.nav{display:flex;overflow:auto}.nav a{white-space:nowrap}.brand{margin-bottom:12px}.top{display:block}.title{font-size:23px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">🎓 Student Marks</div><nav class="nav"><a href="/">🏠 Dashboard</a><a href="/students">👨‍🎓 Students</a><a href="/bulk-upload">📤 Bulk Upload</a><a href="/subjects">📚 Subjects</a><a href="/marks">✏️ Marks Entry</a><a href="/report">📊 Date Report</a></nav></aside><main class="main">{% block content %}{% endblock %}</main></div></body></html>
