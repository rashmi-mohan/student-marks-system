<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Student Marks' }}</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#17233b}
.page{min-height:100vh;display:flex}
.sidebar{width:220px;flex:0 0 220px;min-height:100vh;background:linear-gradient(180deg,#4338ca,#6d43f5);color:#fff;padding:20px 14px;position:sticky;top:0}
.brand{font-size:20px;font-weight:800;margin:0 8px 24px}
.nav a{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;padding:12px 12px;border-radius:10px;margin:5px 0;font-weight:600}
.nav a:hover,.nav a.active{background:rgba(255,255,255,.18)}
.main{flex:1;min-width:0;padding:34px 30px}
.content{max-width:1250px;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}
.page-head h1{margin:0 0 6px;font-size:30px}
.page-head p{margin:0;color:#64748b}
.card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:24px;box-shadow:0 8px 25px rgba(31,41,55,.06);margin-bottom:20px}
.card h2{margin:0 0 18px;font-size:21px}
.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.field{display:flex;flex-direction:column;gap:7px}
label{font-size:14px;font-weight:700;color:#24324a}
label span,small{font-weight:500;color:#7b8798}
input,select,textarea{width:100%;height:44px;padding:0 13px;border:1px solid #cfd7e3;border-radius:9px;background:#fff;color:#17233b;font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#6d43f5;box-shadow:0 0 0 3px rgba(109,67,245,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:9px;padding:11px 17px;font-weight:700;text-decoration:none;cursor:pointer;font-size:14px}
.btn.primary{background:linear-gradient(90deg,#5b3ee8,#8b5cf6);color:#fff}
.btn.secondary{background:#eef2ff;color:#4f46e5}
.btn.primary:hover,.btn.secondary:hover{transform:translateY(-1px)}
.form-actions{display:flex;gap:10px;align-items:center;margin-top:22px}
.class-banner{display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(90deg,#f0edff,#f8f7ff)}
.class-banner strong{font-size:20px}
.class-banner span{display:block;color:#23834d;font-size:13px;margin-top:4px}
.alert{padding:13px 16px;border-radius:10px;margin-bottom:18px}
.alert.success{background:#e9f8ef;color:#18733e}
.alert.error{background:#fff0f0;color:#a32323}
.muted{color:#64748b}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;border-bottom:1px solid #e8edf4;text-align:left;white-space:nowrap}
th{background:#f7f8fc;color:#34425a;font-size:13px}
tr:hover td{background:#fafbff}
@media(max-width:800px){.sidebar{width:190px;flex-basis:190px}.main{padding:22px 16px}.two-col{grid-template-columns:1fr}}
@media(max-width:600px){.page{display:block}.sidebar{width:100%;min-height:auto;position:static;padding:12px}.brand{margin-bottom:10px}.nav{display:flex;overflow-x:auto;gap:4px}.nav a{white-space:nowrap}.main{padding:15px}.page-head{display:block}.page-head .btn{margin-top:12px}.card{padding:18px}.class-banner{display:block}.class-banner .btn{margin-top:12px;width:100%}}
</style></head><body><div class="app"><aside class="side"><div class="brand">🎓 Student Marks</div><nav class="nav"><a href="/">🏠 Dashboard</a><a href="/students">👨‍🎓 Students</a><a href="/bulk-upload">📤 Bulk Upload</a><a href="/subjects">📚 Subjects</a><a href="/marks">✏️ Marks Entry</a><a href="/report">📊 Date Report</a></nav></aside><main class="main">{% block content %}{% endblock %}</main></div></body></html>
