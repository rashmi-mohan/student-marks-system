{% extends 'base.html' %}{% block content %}<div class="top"><div><div class="title">Students</div><div class="sub">Manage student records</div></div><div class="actions"><a class="btn alt" href="/bulk-upload">📤 Bulk Upload</a></div></div><div class="card"><form method="post"><div class="formgrid"><div class="field"><label>USN</label><input name="usn" required></div><div class="field"><label>Student Name</label><input name="name" required></div><div class="field"><label>Semester</label><select name="semester">{% for n in range(1,9) %}<option>{{n}}</option>{% endfor %}</select></div><div class="field"><label>Section</label><select name="section">{% for s in ['A','B','C','D','E','F'] %}<option>{{s}}</option>{% endfor %}</select></div></div><br><button class="btn">+ Add Student</button></form></div><div class="tablewrap"><table class="table"><tr><th>USN</th><th>Student Name</th><th>Semester</th><th>Section</th></tr>{% for s in students %}<tr><td>{{s.usn}}</td><td>{{s.name}}</td><td><span class="pill">Sem {{s.semester}}</span></td><td><span class="pill">{{s.section}}</span></td></tr>{% endfor %}</table></div>{% endblock %}
